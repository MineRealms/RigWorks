modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="rigworks"
version="${mod_version}"
displayName="RigWorks"
logoFile="icon.png"
authors="MineRealms Team"
displayTest="IGNORE_ALL_VERSION"
description='''Character rigs, player animation policies and equipment integration built on AssimpLoader.'''

[[dependencies.rigworks]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.rigworks]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.rigworks]]
modId="assimploader"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.rigworks]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="mixins.rigworks.json"

[[mixins]]
config="mixins.rigworks.kubejs.json"
