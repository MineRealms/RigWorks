pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    create(rootProject) {
        // Node directory name -> logical version used by `//? if` conditions.
        versions(['1.20.1-forge': '1.20.1'])
        versions(['1.21.1-neoforge': '1.21.1'])
    }
}

rootProject.name = 'rigworks'

// AssimpLoader is consumed as a prebuilt jar (see build.gradle); it is deliberately NOT a Gradle
// subproject here. The engine's own build is itself a Stonecutter multi-version build and cannot be
// nested inside another Stonecutter project, so `include 'assimploader'` would fail under Gradle 9.
// The submodule checkout stays in the working tree for reference and for its build output.
