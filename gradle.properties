org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Stonecutter's Groovy support is intentional here; silence its "limited support" notice.
dev.kikugie.stonecutter.hard_mode=true

# Shared mod metadata. Node-specific versions live in versions/<node>/gradle.properties.
mod_id=rigworks
mod_name=RigWorks
mod_license=MIT
mod_authors=MineRealms Team
mod_description=Client character rigs, player animation policies and equipment integration built on AssimpLoader.
mod_version=1.0.0
maven_group=cn.minerealms.rigworks
archives_base_name=rigworks

junit_version=5.9.3

# ModernUI (maven). Dormant dead-wiring kept only so the editor sources still compile.
modernui_forge_version=1.20.1-3.11.0.1
modernui_core_version=3.11.0

# The AssimpLoader engine is packaged from the submodule's compiled classes (see build.gradle).
# Pass -PassimpLoaderJar=<path> to consume an existing jar instead, which is what the 1.21 node
# will do once its NeoForge artefact exists.
