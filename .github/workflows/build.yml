name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ysm:
    name: Native YSM (${{ matrix.prefix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            prefix: win32-x86-64
            cmake_options: '-A x64'
          - runner: windows-11-arm
            prefix: win32-aarch64
            cmake_options: '-A ARM64'
          - runner: ubuntu-24.04
            prefix: linux-x86-64
            cmake_options: ''
          - runner: ubuntu-24.04-arm
            prefix: linux-aarch64
            cmake_options: ''
          - runner: macos-15-intel
            prefix: darwin-x86-64
            cmake_options: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - runner: macos-15
            prefix: darwin-aarch64
            cmake_options: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Configure native converter
        run: cmake -S native/rigworks_ysm -B build/native-ysm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRWYM_RESOURCE_PREFIX=${{ matrix.prefix }} ${{ matrix.cmake_options }}
      - name: Build converter and fixture tests
        run: cmake --build build/native-ysm --config Release --parallel
      - name: Verify real YSM fixture and C ABI
        run: ctest --test-dir build/native-ysm -C Release --output-on-failure
      - name: Stage platform library and notices
        run: cmake --install build/native-ysm --config Release --component RigWorksYsm --prefix native/rigworks_ysm/dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-ysm-${{ matrix.prefix }}
          path: native/rigworks_ysm/dist
          if-no-files-found: error
          retention-days: 2

  collect-native-ysm:
    name: Collect six native targets
    needs: native-ysm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ysm-*
          path: build/native-ysm-artifacts
      - name: Verify every native target and stage runtime resources
        shell: bash
        run: |
          set -euo pipefail
          prefixes=(win32-x86-64 win32-aarch64 linux-x86-64 linux-aarch64 darwin-x86-64 darwin-aarch64)
          for prefix in "${prefixes[@]}"; do
            artifact="build/native-ysm-artifacts/native-ysm-$prefix"
            case "$prefix" in
              win32-*) library="rigworks_ysm.dll" ;;
              darwin-*) library="librigworks_ysm.dylib" ;;
              *) library="librigworks_ysm.so" ;;
            esac
            test -s "$artifact/$prefix/$library"
            mkdir -p "native/rigworks_ysm/dist/$prefix"
            cp "$artifact/$prefix/$library" "native/rigworks_ysm/dist/$prefix/$library"
          done
          test -s build/native-ysm-artifacts/native-ysm-win32-x86-64/licenses/zstd-LICENSE
          mkdir -p native/rigworks_ysm/dist/licenses
          cp build/native-ysm-artifacts/native-ysm-win32-x86-64/licenses/zstd-LICENSE native/rigworks_ysm/dist/licenses/zstd-LICENSE
          python3 -m unittest discover -s tools/native -p test_verify_rigworks_ysm.py
          python3 tools/native/verify_rigworks_ysm.py --manifest native/rigworks_ysm/dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rigworks-ysm-all-platforms
          path: native/rigworks_ysm/dist
          if-no-files-found: error
          retention-days: 2

  build:
    runs-on: ubuntu-latest
    needs: collect-native-ysm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [1.20.1-forge, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: rigworks-ysm-all-platforms
          path: native/rigworks_ysm/dist
      - name: Prepare wrapper and pinned optional dependencies
        run: |
          chmod +x gradlew AssimpLoader/gradlew
          if [ '${{ matrix.node }}' = '1.20.1-forge' ]; then
            ./gradlew -p AssimpLoader :1.20.1-forge:downloadDevDeps --no-daemon --console=plain
          fi
      - name: Build the matching engine and RigWorks node
        run: |
          ./gradlew -p AssimpLoader ':${{ matrix.node }}:build' --no-daemon --console=plain --stacktrace
          ./gradlew ':${{ matrix.node }}:build' --no-daemon --console=plain --stacktrace
      - name: Verify matching artifacts and isolated content
        run: |
          mkdir -p build
          # Artifact names are <mod>-<minecraft>-<version>-<loader>.jar (see da77d07), so match
          # them by pattern rather than by the node name.
          engineJar=$(echo AssimpLoader/versions/${{ matrix.node }}/build/libs/assimploader-*-1.0.0-*.jar)
          rigworksJar=$(echo versions/${{ matrix.node }}/build/libs/rigworks-*-1.0.0-*.jar)
          jar tf "$engineJar" > build/engine-entries.txt
          grep -q 'windows/x64/org/lwjgl/assimp/assimp.dll' build/engine-entries.txt
          grep -q 'linux/x64/org/lwjgl/assimp/libassimp.so' build/engine-entries.txt
          jar tf "$rigworksJar" > build/rigworks-entries.txt
          python3 tools/native/verify_rigworks_ysm.py --jar "$rigworksJar" --manifest build/native-ysm-jar-manifest.json
          if grep -q '^cn/minerealms/assimploader/\|SmokeTest.class$' build/rigworks-entries.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rigworks-and-assimploader-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/rigworks-*-1.0.0-*.jar
            AssimpLoader/versions/${{ matrix.node }}/build/libs/assimploader-*-1.0.0-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/reports/tests/
            versions/${{ matrix.node }}/build/test-results/
            AssimpLoader/versions/${{ matrix.node }}/build/reports/tests/
            AssimpLoader/versions/${{ matrix.node }}/build/test-results/
          if-no-files-found: ignore

  # The Checks tab is out of sight for most reviewers, so fold the matrix result into a
  # single pull request comment. The comment carries a marker and is updated in place on
  # every push instead of stacking up a new one per run.
  report:
    name: PR report
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Post the check summary on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rigworks-build-report -->';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const { data: ref } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest',
            });
            const icon = {
              success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️',
              timed_out: '⌛', stale: '🧹', action_required: '🔒',
            };
            const runs = ref.check_runs.filter(run => run.name !== 'PR report');
            const rows = runs.map(run =>
              `| ${icon[run.conclusion] || '⏳'} | ${run.name} | ${run.conclusion || 'in progress'} |`);
            const failed = runs.filter(run => run.conclusion === 'failure').length;
            let verdict;
            if (rows.length === 0) {
              verdict = '还没有读到任何 check run（工作流可能刚启动），这条评论稍后会被更新。';
            } else if (failed > 0) {
              verdict = `**${failed} 个任务失败。** 点上面的“完整运行”看日志，失败的测试报告会作为构件上传。`;
            } else {
              verdict = '全部通过。合并前仍需在真实客户端里验证：编译和测试通过不等于游戏内可用。';
            }
            const body = [
              marker,
              `### 构建检查 · PR #${pr.number}`,
              '',
              `HEAD \`${sha.slice(0, 7)}\` · [完整运行](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '',
              '| 结果 | 任务 | 结论 |',
              '| --- | --- | --- |',
              ...rows,
              '',
              verdict,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
