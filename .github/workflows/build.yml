name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ysm:
    name: Native converters (${{ matrix.prefix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            prefix: win32-x86-64
            cmake_options: '-A x64'
          - runner: windows-11-arm
            prefix: win32-aarch64
            cmake_options: '-A ARM64'
          - runner: ubuntu-24.04
            prefix: linux-x86-64
            cmake_options: ''
          - runner: ubuntu-24.04-arm
            prefix: linux-aarch64
            cmake_options: ''
          - runner: macos-15-intel
            prefix: darwin-x86-64
            cmake_options: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - runner: macos-15
            prefix: darwin-aarch64
            cmake_options: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Configure native converter
        run: cmake -S native/rigworks_ysm -B build/native-ysm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRWYM_RESOURCE_PREFIX=${{ matrix.prefix }} ${{ matrix.cmake_options }}
      - name: Build converter and fixture tests
        run: cmake --build build/native-ysm --config Release --parallel
      - name: Verify real YSM fixture and C ABI
        run: ctest --test-dir build/native-ysm -C Release --output-on-failure
      - name: Stage platform library and notices
        run: cmake --install build/native-ysm --config Release --component RigWorksYsm --prefix native/rigworks_ysm/dist
      - name: Configure headless MMD converter
        run: cmake -S native/rigworks_mmd -B build/native-mmd -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRWMD_RESOURCE_PREFIX=${{ matrix.prefix }} ${{ matrix.cmake_options }}
      - name: Build MMD converter and tests
        run: cmake --build build/native-mmd --config Release --parallel
      - name: Verify MMD conversion and C ABI
        run: ctest --test-dir build/native-mmd -C Release --output-on-failure
      - name: Stage MMD platform library and notices
        run: cmake --install build/native-mmd --config Release --component RigWorksMmd --prefix native/rigworks_mmd/dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-mmd-${{ matrix.prefix }}
          path: native/rigworks_mmd/dist
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: native-ysm-${{ matrix.prefix }}
          path: native/rigworks_ysm/dist
          if-no-files-found: error
          retention-days: 2

  collect-native-ysm:
    name: Collect six native targets
    needs: native-ysm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ysm-*
          path: build/native-ysm-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-mmd-*
          path: build/native-mmd-artifacts
      - name: Verify every native target and stage runtime resources
        shell: bash
        run: |
          set -euo pipefail
          prefixes=(win32-x86-64 win32-aarch64 linux-x86-64 linux-aarch64 darwin-x86-64 darwin-aarch64)
          for prefix in "${prefixes[@]}"; do
            artifact="build/native-ysm-artifacts/native-ysm-$prefix"
            case "$prefix" in
              win32-*) library="rigworks_ysm.dll" ;;
              darwin-*) library="librigworks_ysm.dylib" ;;
              *) library="librigworks_ysm.so" ;;
            esac
            test -s "$artifact/$prefix/$library"
            mkdir -p "native/rigworks_ysm/dist/$prefix"
            cp "$artifact/$prefix/$library" "native/rigworks_ysm/dist/$prefix/$library"
          done
          test -s build/native-ysm-artifacts/native-ysm-win32-x86-64/licenses/zstd-LICENSE
          mkdir -p native/rigworks_ysm/dist/licenses
          cp build/native-ysm-artifacts/native-ysm-win32-x86-64/licenses/zstd-LICENSE native/rigworks_ysm/dist/licenses/zstd-LICENSE
          python3 -m unittest discover -s tools/native -p test_verify_rigworks_ysm.py
          python3 tools/native/verify_rigworks_ysm.py --manifest native/rigworks_ysm/dist/manifest.json
          for prefix in "${prefixes[@]}"; do
            artifact="build/native-mmd-artifacts/native-mmd-$prefix"
            case "$prefix" in
              win32-*) library="rigworks_mmd.dll" ;;
              darwin-*) library="librigworks_mmd.dylib" ;;
              *) library="librigworks_mmd.so" ;;
            esac
            test -s "$artifact/$prefix/$library"
            mkdir -p "native/rigworks_mmd/dist/$prefix"
            cp "$artifact/$prefix/$library" "native/rigworks_mmd/dist/$prefix/$library"
          done
          mkdir -p native/rigworks_mmd/dist/licenses
          for license in saba-LICENSE glm-LICENSE spdlog-LICENSE json-LICENSE bullet-LICENSE zig-LICENSE libcxx-LICENSE libcxxabi-LICENSE libunwind-LICENSE; do
            cp "build/native-mmd-artifacts/native-mmd-win32-x86-64/licenses/$license" "native/rigworks_mmd/dist/licenses/$license"
          done
          python3 -m unittest discover -s tools/native -p test_verify_rigworks_mmd.py
          python3 tools/native/verify_rigworks_mmd.py --manifest native/rigworks_mmd/dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rigworks-mmd-all-platforms
          path: native/rigworks_mmd/dist
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: rigworks-ysm-all-platforms
          path: native/rigworks_ysm/dist
          if-no-files-found: error
          retention-days: 2

  build:
    runs-on: ubuntu-latest
    needs: collect-native-ysm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [1.20.1-forge, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: rigworks-ysm-all-platforms
          path: native/rigworks_ysm/dist
      - uses: actions/download-artifact@v4
        with:
          name: rigworks-mmd-all-platforms
          path: native/rigworks_mmd/dist
      - name: Prepare wrapper and pinned optional dependencies
        run: |
          chmod +x gradlew AssimpLoader/gradlew
          if [ '${{ matrix.node }}' = '1.20.1-forge' ]; then
            ./gradlew -p AssimpLoader :1.20.1-forge:downloadDevDeps --no-daemon --console=plain
          fi
      - name: Build the matching engine and RigWorks node
        run: |
          ./gradlew -p AssimpLoader ':${{ matrix.node }}:build' --no-daemon --console=plain --stacktrace
          ./gradlew ':${{ matrix.node }}:build' --no-daemon --console=plain --stacktrace
          ./gradlew ':${{ matrix.node }}:verifyBundledJar' --no-daemon --console=plain --stacktrace
      - name: Verify matching artifacts and isolated content
        id: releases
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p build
          node='${{ matrix.node }}'
          minecraft="${node%-*}"
          loader="${node##*-}"
          engineJars=(AssimpLoader/versions/"$node"/build/libs/assimploader-"$minecraft"-*-"$loader".jar)
          standaloneJars=(versions/"$node"/build/libs/rigworks-"$minecraft"-*-"$loader".jar)
          bundledJars=(versions/"$node"/build/libs/rigworks-"$minecraft"-*-"$loader"-with-assimploader.jar)
          if [ "${#engineJars[@]}" -ne 1 ] || [ "${#standaloneJars[@]}" -ne 1 ] || [ "${#bundledJars[@]}" -ne 1 ]; then
            printf 'Expected one engine, standalone and bundled JAR; found %s / %s / %s\n' \
              "${#engineJars[@]}" "${#standaloneJars[@]}" "${#bundledJars[@]}" >&2
            exit 1
          fi
          engineJar="${engineJars[0]}"
          standaloneJar="${standaloneJars[0]}"
          bundledJar="${bundledJars[0]}"
          jar tf "$engineJar" > build/engine-entries.txt
          grep -q 'windows/x64/org/lwjgl/assimp/assimp.dll' build/engine-entries.txt
          grep -q 'linux/x64/org/lwjgl/assimp/libassimp.so' build/engine-entries.txt
          python3 tools/native/verify_rigworks_ysm.py --jar "$standaloneJar" --manifest build/native-ysm-standalone-manifest.json
          python3 tools/native/verify_rigworks_ysm.py --jar "$bundledJar" --manifest build/native-ysm-bundled-manifest.json
          python3 tools/native/verify_rigworks_mmd.py --jar "$standaloneJar" --manifest build/native-mmd-standalone-manifest.json
          python3 tools/native/verify_rigworks_mmd.py --jar "$bundledJar" --manifest build/native-mmd-bundled-manifest.json
          for variant in standalone bundled; do
            if [ "$variant" = standalone ]; then selectedJar="$standaloneJar"; else selectedJar="$bundledJar"; fi
            jar tf "$selectedJar" > "build/rigworks-$variant-entries.txt"
            if grep -Eq '^cn/minerealms/assimploader/|SmokeTest.class$' "build/rigworks-$variant-entries.txt"; then exit 1; fi
          done
          printf 'engineJar=%s\nstandaloneJar=%s\nbundledJar=%s\n' \
            "$engineJar" "$standaloneJar" "$bundledJar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rigworks-and-assimploader-${{ matrix.node }}
          path: |
            ${{ steps.releases.outputs.standaloneJar }}
            ${{ steps.releases.outputs.bundledJar }}
            ${{ steps.releases.outputs.engineJar }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/reports/tests/
            versions/${{ matrix.node }}/build/test-results/
            AssimpLoader/versions/${{ matrix.node }}/build/reports/tests/
            AssimpLoader/versions/${{ matrix.node }}/build/test-results/
          if-no-files-found: ignore

  # The Checks tab is out of sight for most reviewers, so fold the matrix result into a
  # single pull request comment. The comment carries a marker and is updated in place on
  # every push instead of stacking up a new one per run.
  report:
    name: PR report
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Post the check summary on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rigworks-build-report -->';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const { data: ref } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest',
            });
            const icon = {
              success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️',
              timed_out: '⌛', stale: '🧹', action_required: '🔒',
            };
            const runs = ref.check_runs.filter(run => run.name !== 'PR report');
            const rows = runs.map(run =>
              `| ${icon[run.conclusion] || '⏳'} | ${run.name} | ${run.conclusion || 'in progress'} |`);
            const failed = runs.filter(run => run.conclusion === 'failure').length;
            let verdict;
            if (rows.length === 0) {
              verdict = '还没有读到任何 check run（工作流可能刚启动），这条评论稍后会被更新。';
            } else if (failed > 0) {
              verdict = `**${failed} 个任务失败。** 点上面的“完整运行”看日志，失败的测试报告会作为构件上传。`;
            } else {
              verdict = '全部通过。合并前仍需在真实客户端里验证：编译和测试通过不等于游戏内可用。';
            }
            const body = [
              marker,
              `### 构建检查 · PR #${pr.number}`,
              '',
              `HEAD \`${sha.slice(0, 7)}\` · [完整运行](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '',
              '| 结果 | 任务 | 结论 |',
              '| --- | --- | --- |',
              ...rows,
              '',
              verdict,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
