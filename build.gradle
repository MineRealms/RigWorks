buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.apache.maven:maven-artifact:3.9.9' }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    // Both loader plugin families come from ModDevGradle. They are declared here (apply false)
    // so the per-node branch below can apply exactly one of them. ForgeGradle cannot be used:
    // Stonecutter 0.9.x requires Gradle 9, which ForgeGradle 6 does not support.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

abstract class AssimpLoaderBuildLock implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}

def assimpLoaderBuildLock = gradle.sharedServices.registerIfAbsent('rigworksAssimpLoaderBuild', AssimpLoaderBuildLock) {
    maxParallelUsages = 1
}

// This file is Stonecutter's shared build script: it runs once per node.
def isForge = mod_loader == 'forge'

version = mod_version
group = maven_group
base { archivesName = "${archives_base_name}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

// Run directories live at the repository root. The 1.20.1 node keeps the historical `run/`
// layout; the 1.21.1 node gets a `-1.21.1` suffix so the two never share configs, saves or logs.
def runSuffix = isForge ? '' : '-1.21.1'
def runClientDir = rootProject.file(project.findProperty('clientGameDir')
        ?: (project.hasProperty('clientKubeJsSmoke') ? "run-kubejs-${minecraft_version}-${mod_loader}" : "run${runSuffix}"))
def runServerDir = rootProject.file("run-server${runSuffix}")

// The prebuilt AssimpLoader engine. See settings.gradle for why this is not a Gradle subproject.
// The engine's own `reobfJar` output is SRG-named, while this project's LegacyForge development
// runtime (and its tests) run in official names, so consuming that artefact directly fails with
// NoSuchFieldError. Instead, package the engine's already-compiled official classes and resources
// into a mod jar here. Passing -PassimpLoaderJar=<path> consumes an existing jar instead.
def configuredEngineJar = project.findProperty('assimpLoaderJar')
def engineProjectDir = rootProject.file(project.findProperty('assimpLoaderDir') ?: 'AssimpLoader')
def engineNode = "${minecraft_version}-${mod_loader}"
def engineBuildDir = new File(engineProjectDir, "versions/${engineNode}/build")
def engineBuildInputs = fileTree(engineProjectDir) {
    include 'src/**', '*.gradle', 'gradle.properties', 'gradle/**', "versions/${engineNode}/gradle.properties",
            "versions/${engineNode}/src/**", 'LICENSE*', 'licenses/**', 'THIRD_PARTY_NOTICES*', 'third_party_sources/**'
}
def assimpLoaderDevJar = null
def assimpLoaderJar
if (configuredEngineJar != null) {
    assimpLoaderJar = rootProject.file(configuredEngineJar)
    if (!assimpLoaderJar.isFile()) {
        throw new GradleException("AssimpLoader artefact is missing: ${assimpLoaderJar}")
    }
} else {
    def engineClassesDir = new File(engineBuildDir, 'classes/java/main')
    def engineResourcesDir = new File(engineBuildDir, 'resources/main')
    def prepareEngine = tasks.register('prepareAssimpLoader', Exec) {
        group = 'build'
        description = 'Compiles the matching engine node in its independent Gradle build.'
        workingDir engineProjectDir
        usesService assimpLoaderBuildLock
        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def engineCommand = windows ? ['cmd', '/d', '/c', 'gradlew.bat'] : ['./gradlew']
        engineCommand += [":${engineNode}:classes", ":${engineNode}:integrationTestClasses", '--console=plain']
        if (gradle.startParameter.offline) engineCommand += '--offline'
        commandLine engineCommand
        inputs.files(engineBuildInputs)
        outputs.dirs(engineClassesDir, engineResourcesDir, new File(engineBuildDir, 'classes/java/integrationTest'))
    }
    assimpLoaderDevJar = tasks.register('assimpLoaderDevJar', Jar) {
        group = 'build'
        description = 'Packages the prebuilt AssimpLoader classes and resources into an official-named dev mod jar.'
        from engineClassesDir
        from engineResourcesDir
        from(new File(engineBuildDir, 'classes/java/integrationTest')) {
            include 'cn/minerealms/assimploader/client/ShaderParameterGpuChecks*.class'
        }
        archiveFileName = 'assimploader-dev.jar'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        dependsOn prepareEngine
    }
    assimpLoaderJar = layout.buildDirectory.file('libs/assimploader-dev.jar').get().asFile
    // The jar is a plain file dependency, so the tasks that resolve it must wait for it.
    tasks.withType(JavaCompile).configureEach { dependsOn assimpLoaderDevJar }
}

// ------------------------------------------------------------------ source sets
// `integration` holds the client smoke tests. It is merged into the mod in development runs only;
// the shipped jar contains `main` alone.
sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// The engine's client smoke-test helpers (e.g. ShaderParameterGpuChecks) live in AssimpLoader's
// `integrationTest` source set and are not part of its shipped jar. RigWorks' own smoke tests
// compile against them, exactly as they did when the engine was a source project. Point
// -PassimpIntegrationTestClasses=<dir> at another build's output if the submodule is not built.
def assimpIntegrationTestClasses = rootProject.file(project.findProperty('assimpIntegrationTestClasses')
        ?: new File(engineBuildDir, 'classes/java/integrationTest').absolutePath)
sourceSets.integration.compileClasspath += files(assimpIntegrationTestClasses)

configurations {
    localRuntime { canBeConsumed = false; canBeResolved = false }
    runtimeClasspath.extendsFrom localRuntime
    integrationImplementation.extendsFrom implementation
    integrationCompileOnly.extendsFrom compileOnly
    integrationRuntimeOnly.extendsFrom runtimeOnly
}

// Minecraft supplies JNA at runtime; tests need it explicitly on their classpath.
dependencies {
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    testImplementation 'net.java.dev.jna:jna:5.14.0'
}

// -PbuildNative rebuilds the ysmprocessor shared libraries for all four targets
// and refreshes the packaged JNA resources before processResources runs.
if (project.hasProperty('buildNative')) {
    def nativeWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    def nativeScript = rootProject.file(nativeWindows
            ? 'tools/native/build_ysmprocessor.bat'
            : 'tools/native/build_ysmprocessor.sh')
    tasks.register('buildYsmProcessor', Exec) {
        group = 'build'
        description = 'Cross-compiles the ysmprocessor native library with Zig.'
        workingDir rootProject.projectDir
        if (nativeWindows) {
            commandLine 'cmd', '/d', '/c', nativeScript.absolutePath
        } else {
            commandLine 'bash', nativeScript.absolutePath
        }
    }
    tasks.named('processResources') { dependsOn 'buildYsmProcessor' }
}

def buildMmdNative = tasks.register('buildMmdNative', Exec) {
    group = 'build'
    description = 'Rebuilds, tests and stages the host MMD import-only converter.'
    workingDir rootProject.projectDir
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                rootProject.file('tools/native/build_rigworks_mmd.ps1').absolutePath
    } else {
        commandLine 'bash', rootProject.file('tools/native/build_rigworks_mmd.sh').absolutePath
    }
}
if (providers.gradleProperty('buildMmdNative').isPresent()) {
    tasks.named('processResources') { dependsOn buildMmdNative }
}

repositories {
    if (rootProject.hasProperty('f3TweakerJar')) {
        flatDir { dirs rootProject.file(rootProject.property('f3TweakerJar')).parentFile }
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven { url = 'https://maven.izzel.io/releases/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.github.stephengold'
            includeGroup 'javax.vecmath'
        }
    }
    if (project.hasProperty('rosettaRepo')) {
        maven {
            url = uri(project.property('rosettaRepo'))
            content { includeGroup 'dev.rosetta' }
        }
    }
}

if (isForge) {
    // ---------------------------------------------------------------- 1.20.1 / Forge (LegacyForge)
    apply plugin: 'net.neoforged.moddev.legacyforge'

    legacyForge {
        // ModDevGradle picks its "without recompilation" artifact pipeline whenever CI=true.
        // That pipeline keeps Forge's own signed manifest in the produced jar, so the patched
        // classes fail the SHA-256 digest check as soon as a test loads one of them
        // (SecurityException: SHA-256 digest error for net/minecraftforge/...). The recompiled
        // artifact carries no signature, so pin the behaviour instead of inheriting the
        // environment's CI variable. `enable` replaces the modding settings, so the version has
        // to be repeated inside the same block.
        enable {
            forgeVersion = "${minecraft_version}-${forge_version}"
            disableRecompilation = false
        }

        runs {
            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'info'
                // LegacyForge sets `mixin.env.remapRefMap` and `mixin.env.refMapRemappingFile`
                // itself, pointing at its own intermediate-to-named mapping file.
            }
            client {
                client()
                gameDirectory = runClientDir
                programArgument '--width'
                programArgument (project.findProperty('clientWidth') ?: '1600').toString()
                programArgument '--height'
                programArgument (project.findProperty('clientHeight') ?: '900').toString()
                if (project.hasProperty('clientUsername')) {
                    programArgument '--username'
                    programArgument project.property('clientUsername').toString()
                }
                if (project.hasProperty('clientServer')) {
                    programArgument '--quickPlayMultiplayer'
                    programArgument project.property('clientServer').toString()
                }
                if (project.hasProperty('clientWorld')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('clientWorld').toString()
                }
                if (project.hasProperty('rosettaRepo')) {
                    systemProperty 'rosetta.remote.bind', '127.0.0.1'
                    systemProperty 'rosetta.remote.port', project.findProperty('rosettaPort') ?: '48790'
                }
                def worldTests = [
                    clientCharacterSmoke          : ['charactertest.enabled', 'charactertest.world'],
                    clientCharacterClipSmoke      : ['charactercliptest.enabled', 'charactercliptest.world'],
                    clientVanillaCompatibilitySmoke: ['vanillaCompatibilityTest.enabled', 'vanillaCompatibilityTest.world'],
                    clientLookDevSmoke            : ['lookdevtest.enabled', 'lookdevtest.world'],
                    clientWorkbenchSmoke          : ['workbenchtest.enabled', 'workbenchtest.world'],
                    clientWorkbenchPersistenceSmoke: ['rigworkspersistence.enabled', 'rigworkspersistence.world'],
                    clientAvatarPackageSmoke      : ['avatarpackagetest.enabled', 'avatarpackagetest.world'],
                    clientYsmSmoke                 : ['rigworks.ysm.enabled', 'rigworks.ysm.world']
                ]
                worldTests.each { option, keys ->
                    if (project.hasProperty(option)) {
                        systemProperty keys[0], 'true'
                        systemProperty keys[1], project.property(option).toString()
                    }
                }
                if (project.hasProperty('clientAvatarPackageAsset')) {
                    systemProperty 'avatarpackagetest.asset', rootProject.file(project.property('clientAvatarPackageAsset')).absolutePath
                }
                if (project.hasProperty('clientCharacterGpuSmoke')) {
                    systemProperty 'charactercliptest.requireOculusGpu', 'true'
                }
                if (project.hasProperty('clientVanillaPoseOnly')) systemProperty 'lookdevtest.poseOnly', 'true'
                if (project.hasProperty('clientEquipmentWorkbenchSmoke')) systemProperty 'equipmentworkbenchtest.enabled', 'true'
                if (project.hasProperty('clientKubeJsSmoke')) systemProperty 'rigworks.kubejsSmoke', 'true'
                if (project.hasProperty('clientYsmAsset')) {
                    systemProperty 'rigworks.ysm.asset', rootProject.file(project.property('clientYsmAsset')).absolutePath
                }
                if (project.hasProperty('clientYsmKeepOpen')) systemProperty 'rigworks.ysm.keepOpen', 'true'
                if (project.hasProperty('clientWorkbenchAsset')) {
                    systemProperty 'workbenchtest.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                    systemProperty 'rigworkspersistence.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                }
                if (project.hasProperty('clientCharacterSyncRole')) {
                    systemProperty 'charactersynctest.role', project.property('clientCharacterSyncRole').toString()
                    systemProperty 'charactersynctest.world', (project.findProperty('clientCharacterSyncWorld') ?: 'Character_Config_Sync_Acceptance').toString()
                    systemProperty 'charactersynctest.port', (project.findProperty('clientCharacterSyncPort') ?: '25575').toString()
                    systemProperty 'charactersynctest.coordination', rootProject.file(project.findProperty('clientCharacterSyncCoordination') ?: 'build/character-sync-coordination').absolutePath
                    systemProperty 'charactersynctest.timeoutSeconds', (project.findProperty('clientCharacterSyncTimeout') ?: '600').toString()
                    if (project.hasProperty('clientWorkbenchSmoke')) systemProperty 'workbenchtest.afterSync', 'true'
                }
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
            }
            server {
                server()
                gameDirectory = rootProject.file(project.findProperty('serverGameDir') ?: "run-server${runSuffix}")
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', mod_id
            }
        }

        mods {
            rigworks {
                sourceSet sourceSets.main
                sourceSet sourceSets.integration
            }
        }

        // Isolated source sets do not inherit the modding classpath; give each one explicitly.
        addModdingDependenciesTo sourceSets.integration
        addModdingDependenciesTo sourceSets.test
    }

    dependencies {
        // The AssimpLoader engine itself. A plain file dependency: MDG's `mod*` configurations
        // reject file collections, and `implementation` is on the modded compile/runtime
        // classpath for LegacyForge.
        implementation files(assimpLoaderJar)
        runtimeOnly files(assimpLoaderJar)

        // AssimpLoader's runtime libraries must be reachable from the game class loader. When the
        // engine was a source project these arrived through its `minecraftLibrary` configuration;
        // with a prebuilt jar they have to be declared here. LWJGL core is supplied by Minecraft.
        additionalRuntimeClasspath("com.github.stephengold:jbullet:${jbullet_version}") { transitive = false }
        additionalRuntimeClasspath("com.github.stephengold:stack-alloc:${stack_alloc_version}") { transitive = false }
        additionalRuntimeClasspath("javax.vecmath:vecmath:${vecmath_version}") { transitive = false }
        additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }
        for (nativesClassifier in ['windows', 'linux', 'macos', 'windows-arm64', 'linux-arm64', 'macos-arm64']) {
            additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}") {
                transitive = false
            }
            testRuntimeOnly("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${nativesClassifier}") {
                transitive = false
            }
        }

        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

        for (coordinate in ["dev.latvian.mods:kubejs-forge:${kubejs_version}",
                            "dev.latvian.mods:rhino-forge:${rhino_version}",
                            "dev.architectury:architectury-forge:${architectury_version}"]) {
            modCompileOnly(coordinate) { transitive = false }
            if (project.hasProperty('withKubeJS') || project.hasProperty('clientKubeJsSmoke')) {
                modRuntimeOnly(coordinate) { transitive = false }
            }
        }
        if (!project.hasProperty('withoutOculus')) {
            modRuntimeOnly("maven.modrinth:oculus:${oculus_version}") { transitive = false }
            modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}") { transitive = false }
        }
        if (project.hasProperty('f3TweakerJar')) {
            def devJar = rootProject.file(project.property('f3TweakerJar'))
            if (!devJar.isFile()) throw new GradleException("F3Tweaker JAR does not exist: ${devJar}")
            modRuntimeOnly files(devJar)
        }
        if (project.hasProperty('rosettaRepo')) {
            modRuntimeOnly("dev.rosetta:rosetta-remote-debug-bridge-forge:${project.findProperty('rosettaVersion') ?: '1.0.0'}") {
                transitive = false
            }
        }
        // The unit tests exercise the physics solver and the Assimp bindings directly, so the
        // engine's libraries are needed on the test compile classpath too.
        testImplementation("com.github.stephengold:jbullet:${jbullet_version}") { transitive = false }
        testImplementation("com.github.stephengold:stack-alloc:${stack_alloc_version}") { transitive = false }
        testImplementation("javax.vecmath:vecmath:${vecmath_version}") { transitive = false }
        testImplementation("org.lwjgl:lwjgl-assimp:${lwjgl_version}") { transitive = false }
        testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_version}"
        testImplementation("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
        // The launcher artifact lives in the 1.x line even though junit-jupiter is 5.x.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
    }

    // Forge 1.20.1 has no `[[mixins]]` support in mods.toml; the only registration point is the
    // `MixinConfigs` manifest attribute. MDG's mixin extension also generates the refmaps.
    mixin {
        add sourceSets.main, 'rigworks.refmap.json'
        config 'mixins.rigworks.json'
        config 'mixins.rigworks.kubejs.json'
    }
} else {
    // ---------------------------------------------------------------- 1.21.1 / NeoForge
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = neo_version

        runs {
            configureEach {
                gameDirectory = rootProject.file("run${runSuffix}")
            }
            client {
                client()
                gameDirectory = runClientDir
                programArgument '--width'
                programArgument (project.findProperty('clientWidth') ?: '1600').toString()
                programArgument '--height'
                programArgument (project.findProperty('clientHeight') ?: '900').toString()
                if (project.hasProperty('clientUsername')) {
                    programArgument '--username'
                    programArgument project.property('clientUsername').toString()
                }
                if (project.hasProperty('clientWorld')) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument project.property('clientWorld').toString()
                }
                if (project.hasProperty('clientServer')) {
                    programArgument '--quickPlayMultiplayer'
                    programArgument project.property('clientServer').toString()
                }
                [clientCharacterSmoke: 'charactertest', clientCharacterClipSmoke: 'charactercliptest',
                 clientVanillaCompatibilitySmoke: 'vanillaCompatibilityTest', clientLookDevSmoke: 'lookdevtest',
                 clientWorkbenchSmoke: 'workbenchtest', clientWorkbenchPersistenceSmoke: 'rigworkspersistence',
                 clientAvatarPackageSmoke: 'avatarpackagetest', clientYsmSmoke: 'rigworks.ysm'].each { option, prefix ->
                    if (project.hasProperty(option)) {
                        systemProperty "${prefix}.enabled", 'true'
                        systemProperty "${prefix}.world", project.property(option).toString()
                    }
                }
                if (project.hasProperty('clientAvatarPackageAsset')) {
                    systemProperty 'avatarpackagetest.asset', rootProject.file(project.property('clientAvatarPackageAsset')).absolutePath
                }
                if (project.hasProperty('clientCharacterGpuSmoke')) systemProperty 'charactercliptest.requireOculusGpu', 'true'
                if (project.hasProperty('clientCharacterSmokeStage')) systemProperty 'charactertest.startStage', project.property('clientCharacterSmokeStage').toString()
                if (project.hasProperty('clientVanillaPoseOnly')) systemProperty 'lookdevtest.poseOnly', 'true'
                if (project.hasProperty('clientEquipmentWorkbenchSmoke')) systemProperty 'equipmentworkbenchtest.enabled', 'true'
                if (project.hasProperty('clientKubeJsSmoke')) systemProperty 'rigworks.kubejsSmoke', 'true'
                if (project.hasProperty('clientWorkbenchAsset')) {
                    systemProperty 'workbenchtest.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                    systemProperty 'rigworkspersistence.asset', rootProject.file(project.property('clientWorkbenchAsset')).absolutePath
                }
                if (project.hasProperty('clientYsmAsset')) {
                    systemProperty 'rigworks.ysm.asset', rootProject.file(project.property('clientYsmAsset')).absolutePath
                }
                if (project.hasProperty('clientYsmKeepOpen')) systemProperty 'rigworks.ysm.keepOpen', 'true'
                if (project.hasProperty('clientCharacterSyncRole')) {
                    systemProperty 'charactersynctest.role', project.property('clientCharacterSyncRole').toString()
                    systemProperty 'charactersynctest.world', (project.findProperty('clientCharacterSyncWorld') ?: 'Character_Config_Sync_Acceptance').toString()
                    systemProperty 'charactersynctest.port', (project.findProperty('clientCharacterSyncPort') ?: '25575').toString()
                    systemProperty 'charactersynctest.coordination', rootProject.file(project.findProperty('clientCharacterSyncCoordination') ?: 'build/character-sync-coordination').absolutePath
                    systemProperty 'charactersynctest.timeoutSeconds', (project.findProperty('clientCharacterSyncTimeout') ?: '600').toString()
                }
            }
            server {
                server()
                gameDirectory = runServerDir
                programArgument '--nogui'
            }
        }

        mods {
            rigworks {
                sourceSet sourceSets.main
                sourceSet sourceSets.integration
            }
        }

        addModdingDependenciesTo sourceSets.integration
        addModdingDependenciesTo sourceSets.test
    }

    if (project.hasProperty('clientYsmSmoke')) {
        def ysmResultFile = new File(runClientDir, 'rigworks-ysm-smoke-result.json')
        def checkYsmResult = {
            if (!ysmResultFile.isFile()) throw new GradleException('YSM import smoke did not produce ' + ysmResultFile)
            def result = new groovy.json.JsonSlurper().parse(ysmResultFile)
            if (result.success != true || result.renderedPasses < 1 || result.meshInstances < 1
                    || result.maxPaletteDifference <= 0 || result.settleMillis < 10_000) {
                throw new GradleException("YSM client acceptance failed: ${result.error}")
            }
            println "YSM client acceptance passed: meshes=${result.meshCount}, bones=${result.skinnedBones}, draws=${result.renderedPasses}, poseChange=${result.maxPaletteDifference}"
        }
        tasks.register('checkYsmSmokeResult') {
            group = 'verification'
            description = 'Checks real-client RWYM binding, animation and rendering acceptance.'
            doLast checkYsmResult
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst { delete ysmResultFile }
            doLast checkYsmResult
        }
    }

    dependencies {
        // NeoForge runs in official mappings, so the plain configurations carry everything and
        // there are no `mod*` remapping configurations on this node.
        implementation files(assimpLoaderJar)
        for (coordinate in ["com.github.stephengold:jbullet:${jbullet_version}",
                            "com.github.stephengold:stack-alloc:${stack_alloc_version}",
                            "javax.vecmath:vecmath:${vecmath_version}", "org.lwjgl:lwjgl-assimp:${lwjgl_version}"]) {
            compileOnly(coordinate) { transitive = false }
            additionalRuntimeClasspath(coordinate) { transitive = false }
            testImplementation(coordinate) { transitive = false }
        }
        for (classifier in ['windows', 'linux', 'macos', 'windows-arm64', 'linux-arm64', 'macos-arm64']) {
            additionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${classifier}") { transitive = false }
            testRuntimeOnly("org.lwjgl:lwjgl-assimp:${lwjgl_version}:natives-${classifier}") { transitive = false }
        }
        compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        testImplementation("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        if (project.hasProperty('withKubeJS') || project.hasProperty('clientKubeJsSmoke')) {
            runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
            runtimeOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
        }
        if (project.hasProperty('f3TweakerJar')) {
            def devJar = rootProject.file(project.property('f3TweakerJar'))
            if (!devJar.isFile()) throw new GradleException("F3Tweaker JAR does not exist: ${devJar}")
            runtimeOnly files(devJar)
        }
        if (!project.hasProperty('withoutOculus')) {
            runtimeOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
            runtimeOnly("maven.modrinth:sodium:${sodium_version}") { transitive = false }
        }
        testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_version}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
        // The launcher artifact lives in the 1.x line even though junit-jupiter is 5.x.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
    }
}

// Process the non-main source sets with the same Stonecutter target rules as production sources.
stonecutter.tasks.configureSource(sourceSets.integration)
stonecutter.tasks.configureSource(sourceSets.test)

jar {
    archiveClassifier = mod_loader
    if (isForge) manifest { attributes 'MixinConfigs': 'mixins.rigworks.json,mixins.rigworks.kubejs.json' }
    from(rootProject.file('LICENSE')) { into 'META-INF' }
}

// A bundled release keeps AssimpLoader as a real nested mod jar. Do not merge its classes or
// loader metadata into RigWorks: Forge/NeoForge must discover both mod identities separately,
// while AssimpLoader's own Jar-in-Jar libraries and platform natives remain intact.
def productionJarTask = isForge ? tasks.named('reobfJar') : tasks.named('jar')
def configuredBundleJar = project.findProperty('assimpLoaderBundleJar')
def enginePropertyFile = new File(engineProjectDir, "versions/${engineNode}/gradle.properties")
def engineProperties = new Properties()
def engineRootPropertyFile = new File(engineProjectDir, 'gradle.properties')
if (engineRootPropertyFile.isFile()) engineRootPropertyFile.withInputStream { engineProperties.load(it) }
if (enginePropertyFile.isFile()) enginePropertyFile.withInputStream { engineProperties.load(it) }
def engineVersion = engineProperties.getProperty('mod_version')
def engineArchivesBase = engineProperties.getProperty('archives_base_name', 'assimploader')
def engineLoader = engineProperties.getProperty('mod_loader', mod_loader)
def defaultBundleJar = new File(engineProjectDir,
        "versions/${engineNode}/build/libs/${engineArchivesBase}-${minecraft_version}-${engineVersion}-${engineLoader}.jar")
def selectedBundleJar = { configuredBundleJar == null ? defaultBundleJar : rootProject.file(configuredBundleJar) }
def prepareAssimpLoaderRelease = null
if (configuredBundleJar == null) {
    prepareAssimpLoaderRelease = tasks.register('prepareAssimpLoaderRelease', Exec) {
        group = 'build'
        description = 'Builds the matching AssimpLoader production release used by bundledJar.'
        workingDir engineProjectDir
        usesService assimpLoaderBuildLock
        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def command = windows ? ['cmd', '/d', '/c', 'gradlew.bat'] : ['./gradlew']
        command += [":${engineNode}:${isForge ? 'reobfJar' : 'jar'}", '--console=plain']
        if (gradle.startParameter.offline) command += '--offline'
        commandLine command
        inputs.files(engineBuildInputs)
        outputs.file(defaultBundleJar)
        doLast {
            if (!enginePropertyFile.isFile() || !engineVersion || !engineLoader)
                throw new GradleException("AssimpLoader node properties are missing or incomplete: ${enginePropertyFile}")
            if (!defaultBundleJar.isFile())
                throw new GradleException("AssimpLoader production release was not produced: ${defaultBundleJar}")
        }
    }
}

def readJarText = { File jar, String entryName ->
    def zip = new java.util.zip.ZipFile(jar)
    try {
        def entry = zip.getEntry(entryName)
        if (entry == null) throw new GradleException("Missing ${entryName} in ${jar}")
        zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
    } finally { zip.close() }
}
def descriptorValue = { String text, String key ->
    def match = (text =~ /(?m)^${java.util.regex.Pattern.quote(key)}="([^"]+)"/)
    match.find() ? match.group(1) : null
}
def descriptorDependencyRange = { String text, String dependencyId ->
    def block = (text =~ /(?s)\[\[dependencies\.assimploader\]\](.*?)(?=\[\[|\z)/)
    while (block.find()) {
        def section = block.group(1)
        if (descriptorValue(section, 'modId') == dependencyId) return descriptorValue(section, 'versionRange')
    }
    null
}
def rangeContains = { String range, String version ->
    if (!range || !version) return false
    def spec = org.apache.maven.artifact.versioning.VersionRange.createFromVersionSpec(range)
    def actual = new org.apache.maven.artifact.versioning.DefaultArtifactVersion(version)
    spec.containsVersion(actual) || spec.recommendedVersion?.compareTo(actual) == 0
}

def bundleMetadataFile = layout.buildDirectory.file('generated/bundledJar/META-INF/jarjar/metadata.json')
def generateBundleMetadata = tasks.register('generateBundledJarMetadata') {
    group = 'build'
    description = 'Generates Jar-in-Jar metadata for the selected AssimpLoader release.'
    if (prepareAssimpLoaderRelease != null) dependsOn prepareAssimpLoaderRelease
    inputs.file { selectedBundleJar() }
    inputs.property('minecraft', minecraft_version)
    inputs.property('loader', mod_loader)
    outputs.file(bundleMetadataFile)
    doLast {
        File selected = selectedBundleJar()
        if (!selected.isFile()) throw new GradleException("AssimpLoader release JAR is missing: ${selected}")
        String descriptorName = isForge ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'
        String descriptor = readJarText(selected, descriptorName)
        String actualVersion = descriptorValue(descriptor, 'version')
        String actualMod = descriptorValue(descriptor, 'modId')
        String minecraftRange = descriptorDependencyRange(descriptor, 'minecraft')
        String loaderRange = descriptorDependencyRange(descriptor, isForge ? 'forge' : 'neoforge')
        if (actualMod != 'assimploader') throw new GradleException("Selected JAR is not AssimpLoader: ${selected}")
        if (!actualVersion || !rangeContains(minecraftRange, minecraft_version) ||
                !rangeContains(loaderRange, isForge ? forge_version : neo_version))
            throw new GradleException("AssimpLoader descriptor is incompatible with ${minecraft_version}/${mod_loader}: ${selected}")
        if (configuredBundleJar == null && (!engineVersion || actualVersion != engineVersion || engineLoader != mod_loader))
            throw new GradleException("AssimpLoader release ${actualVersion}/${engineLoader} does not match node properties ${engineVersion}/${mod_loader}")
        if (readJarText(selected, 'META-INF/jarjar/metadata.json').trim().isEmpty())
            throw new GradleException("AssimpLoader Jar-in-Jar metadata is empty: ${selected}")
        def payload = [jars: [[
                identifier: [group: 'cn.minerealms', artifact: 'assimploader'],
                version: [range: "[${actualVersion},)", artifactVersion: actualVersion],
                path: "META-INF/jarjar/${selected.name}",
                isObfuscated: isForge
        ]]]
        File output = bundleMetadataFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + '\n', 'UTF-8')
        logger.lifecycle("Bundling AssimpLoader ${selected.name} (${actualVersion}) into RigWorks ${minecraft_version}")
    }
}

def bundledRigWorksJar = tasks.register('bundledJar', Jar) {
    group = 'build'
    description = 'Builds RigWorks with the matching AssimpLoader release nested as a Jar-in-Jar mod.'
    dependsOn productionJarTask, generateBundleMetadata
    archiveBaseName = base.archivesName.get()
    archiveVersion = project.version
    archiveClassifier = "${mod_loader}-with-assimploader"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(productionJarTask.get().archiveFile.get().asFile) })
    from({ selectedBundleJar() }) { into 'META-INF/jarjar' }
    from({ bundleMetadataFile.get().asFile }) { into 'META-INF/jarjar'; rename { 'metadata.json' } }
    doFirst {
        def original = new java.util.zip.ZipFile(productionJarTask.get().archiveFile.get().asFile)
        try {
            def entry = original.getEntry('META-INF/MANIFEST.MF')
            if (entry == null) throw new GradleException('Production RigWorks JAR has no manifest')
            original.getInputStream(entry).withCloseable { stream ->
                def attributes = new java.util.jar.Manifest(stream).mainAttributes
                manifest.attributes(attributes.collectEntries { key, value -> [(key.toString()): value.toString()] })
            }
        } finally { original.close() }
    }
}

def verifyBundledJar = tasks.register('verifyBundledJar') {
    group = 'verification'
    description = 'Verifies the bundled RigWorks Jar-in-Jar release and retained production metadata.'
    dependsOn bundledRigWorksJar
    inputs.file(bundledRigWorksJar.flatMap { it.archiveFile })
    doLast {
        File output = bundledRigWorksJar.get().archiveFile.get().asFile
        File selected = selectedBundleJar()
        if (!selected.isFile()) throw new GradleException("Selected AssimpLoader JAR is missing: ${selected}")
        def outZip = new java.util.zip.ZipFile(output)
        def engineZip = new java.util.zip.ZipFile(selected)
        def production = new java.util.zip.ZipFile(productionJarTask.get().archiveFile.get().asFile)
        try {
            def nestedPath = "META-INF/jarjar/${selected.name}"
            def nested = outZip.getEntry(nestedPath)
            if (nested == null) throw new GradleException("Bundled AssimpLoader entry is missing: ${nestedPath}")
            byte[] nestedBytes = outZip.getInputStream(nested).withCloseable { it.readAllBytes() }
            if (!java.util.Arrays.equals(nestedBytes, selected.bytes)) throw new GradleException('Bundled AssimpLoader bytes differ from selected release')
            def metadataEntry = outZip.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) throw new GradleException('Bundled Jar-in-Jar metadata is missing')
            def metadata = new groovy.json.JsonSlurper().parseText(outZip.getInputStream(metadataEntry).getText('UTF-8'))
            def record = metadata.jars.find { it.path == nestedPath }
            if (record == null || record.identifier.group != 'cn.minerealms' || record.identifier.artifact != 'assimploader')
                throw new GradleException('Bundled Jar-in-Jar metadata does not point to AssimpLoader')
            if (record.isObfuscated != isForge) throw new GradleException('Bundled Jar-in-Jar obfuscation flag is incorrect')
            String descriptor = readJarText(selected, isForge ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml')
            if (record.version.artifactVersion != descriptorValue(descriptor, 'version'))
                throw new GradleException('Bundled AssimpLoader version does not match its descriptor')
            def outputManifest = new java.util.jar.Manifest(outZip.getInputStream(outZip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            def productionManifest = new java.util.jar.Manifest(production.getInputStream(production.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            productionManifest.each { key, value ->
                if (outputManifest.getValue(key) != value.toString()) throw new GradleException("Bundled manifest lost ${key}")
            }
            if (isForge && outputManifest.getValue('MixinConfigs') != 'mixins.rigworks.json,mixins.rigworks.kubejs.json')
                throw new GradleException('Bundled Forge manifest is missing RigWorks MixinConfigs')
            ['mixins.rigworks.json', 'mixins.rigworks.kubejs.json'].each { config ->
                def mixin = new groovy.json.JsonSlurper().parseText(readJarText(output, config))
                if (isForge && config == 'mixins.rigworks.json' && !mixin.refmap)
                    throw new GradleException('Bundled Forge player Mixins have no refmap configured')
                if (isForge && mixin.refmap && outZip.getEntry(mixin.refmap) == null)
                    throw new GradleException("Bundled Forge JAR is missing the refmap for ${config}")
            }
            def flat = outZip.entries().toList()*.name.find { it.startsWith('cn/minerealms/assimploader/') || it.endsWith('SmokeTest.class') }
            if (flat != null) throw new GradleException("Bundled JAR contains flat engine/test content: ${flat}")
            if (engineZip.getEntry('cn/minerealms/assimploader/AssimpLoader.class') == null)
                throw new GradleException('Selected AssimpLoader release has no engine entry point')
            def engineMetadata = new groovy.json.JsonSlurper().parseText(readJarText(selected, 'META-INF/jarjar/metadata.json'))
            def requiredLibraries = ['jbullet', 'stack-alloc', 'vecmath', 'lwjgl-assimp'] as Set
            engineMetadata.jars.each { dependency ->
                if (!dependency.path || engineZip.getEntry(dependency.path) == null)
                    throw new GradleException("AssimpLoader is missing its nested library ${dependency.path}")
                requiredLibraries.remove(dependency.identifier.artifact)
            }
            if (!requiredLibraries.isEmpty())
                throw new GradleException("AssimpLoader is missing required dependencies: ${requiredLibraries}")
            ['windows-x86', 'windows-x86_64', 'windows-aarch64', 'linux-x86_64', 'linux-aarch64', 'linux-armv7',
             'macos-x86_64', 'macos-aarch64'].each { platform ->
                def library = platform.startsWith('windows') ? 'fabrik.dll' : platform.startsWith('macos') ? 'libfabrik.dylib' : 'libfabrik.so'
                if (engineZip.getEntry("native/fabrik/${platform}/${library}") == null)
                    throw new GradleException("AssimpLoader is missing FABRIK for ${platform}")
            }
            ['windows/x64/org/lwjgl/assimp/assimp.dll', 'windows/arm64/org/lwjgl/assimp/assimp.dll',
             'linux/x64/org/lwjgl/assimp/libassimp.so', 'linux/arm64/org/lwjgl/assimp/libassimp.so',
             'macos/x64/org/lwjgl/assimp/libassimp.dylib', 'macos/arm64/org/lwjgl/assimp/libassimp.dylib'].each { path ->
                if (engineZip.getEntry(path) == null) throw new GradleException("AssimpLoader is missing native ${path}")
            }
            logger.lifecycle("Verified bundled RigWorks release: ${output.name}")
        } finally { outZip.close(); engineZip.close(); production.close() }
    }
}

def metadata = [minecraft_version_range: minecraft_version_range, loader_version_range: loader_version_range,
                kubejs_version_range: kubejs_version_range, pack_format: pack_format, mod_version: mod_version]
if (!isForge) metadata.neo_version_range = neo_version_range
tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('native/rigworks_ysm/dist')) {
        include '**/rigworks_ysm.dll', '**/librigworks_ysm.so', '**/librigworks_ysm.dylib', '**/licenses/**'
        into 'natives/rigworks_ysm'
    }
    from(rootProject.file('native/rigworks_mmd/dist')) {
        include '**/rigworks_mmd.dll', '**/librigworks_mmd.so', '**/librigworks_mmd.dylib', '**/licenses/**', '**/manifest.json'
        into 'natives/rigworks_mmd'
    }
    inputs.properties metadata
    if (!isForge) exclude 'META-INF/mods.toml'
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand metadata }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac stops at 100 errors by default, which hides most of a migration's error list.
    options.compilerArgs << '-Xmaxerrs' << '10000'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (project.hasProperty('clientYsmAsset')) {
        systemProperty 'rigworks.ysm.asset', rootProject.file(project.property('clientYsmAsset')).absolutePath
    }
    if (project.hasProperty('ysmCompatFixtures')) {
        systemProperty 'rigworks.ysm.compatFixtures', project.property('ysmCompatFixtures').toString()
    }
    if (project.hasProperty('mmdModelFixture')) {
        systemProperty 'rigworks.mmd.modelFixture', rootProject.file(project.property('mmdModelFixture')).absolutePath
    }
    // Tests resolve asset paths (e.g. src/main/resources/assets/...) against the working
    // directory. In a Stonecutter build the node project lives in versions/<node>, so without
    // this they would look under versions/<node>/src/main/resources.
    workingDir = rootProject.projectDir
}

tasks.named('build').configure { dependsOn 'integrationClasses', 'verifyModuleBoundaries' }
apply from: rootProject.file('gradle/module-boundaries.gradle')

// These local-only tools are staged into the selected client game directory before every
// runClient. Keep Forge and NeoForge builds in separate folders and fail before launch if the
// developer has not provided exactly one jar for each required tool.
def clientSupportModsDir = rootProject.file('dev-client-mods/' + minecraft_version + '-' + mod_loader)
def requiredClientSupportMods = ['modernui', 'f3tweaker', 'rosetta']
def stageClientSupportMods = tasks.register('stageClientSupportMods') {
    group = 'run'
    description = 'Copies the required local client tools into the selected runClient mods folder.'
    doLast {
        if (!clientSupportModsDir.isDirectory()) {
            throw new GradleException('Missing required local client mod directory: ' + clientSupportModsDir)
        }
        def resolvedJars = requiredClientSupportMods.collectEntries { id ->
            def matches = clientSupportModsDir.listFiles()?.findAll { candidate ->
                candidate.isFile() && candidate.name.toLowerCase(Locale.ROOT).endsWith('.jar')
                        && candidate.name.toLowerCase(Locale.ROOT).contains(id)
            } ?: []
            if (matches.size() != 1) {
                throw new GradleException('Expected exactly one ' + id + ' jar in ' + clientSupportModsDir
                        + '; found ' + matches.size())
            }
            [(id): matches[0]]
        }
        def destination = new File(runClientDir, 'mods')
        destination.mkdirs()
        resolvedJars.values().each { jar ->
            copy {
                from jar
                into destination
            }
        }
        logger.lifecycle('Staged ' + resolvedJars.size() + ' required client support mods into ' + destination)
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn stageClientSupportMods
}

// ==================== KubeJS acceptance scripts ====================
// The acceptance scripts are copied into the run's kubejs folder before the client starts and
// removed afterwards, so a failing run never leaves a generated script behind.
if (project.hasProperty('clientKubeJsSmoke')) {
    def gameDirectory = runClientDir
    def target = new File(gameDirectory, 'kubejs/client_scripts/rigworks_acceptance.generated.js')
    def resultFile = new File(gameDirectory, 'rigworks-kubejs-smoke-result.json')
    def payload = (rootProject.file('examples/kubejs/client_scripts/rigworks_player_actions.js').getText('UTF-8') + '\n' +
            rootProject.file('model-tests/kubejs/rigworks_acceptance.js').getText('UTF-8')).getBytes('UTF-8')
    def prepare = tasks.register('prepareKubeJsSmoke') {
        doLast {
            byte[] bytes = payload
            if (target.exists() && !Arrays.equals(target.bytes, bytes)) {
                throw new GradleException('Refusing to replace an existing acceptance script')
            }
            target.parentFile.mkdirs()
            target.bytes = bytes
            def webConfig = new File(gameDirectory, 'kubejs/config/web_server.json')
            if (!webConfig.exists() && !project.hasProperty('clientGameDir')) {
                webConfig.parentFile.mkdirs()
                webConfig.text = groovy.json.JsonOutput.toJson([enabled: false])
            }
            if (resultFile.exists() && !resultFile.delete()) {
                throw new GradleException('Cannot remove stale acceptance result')
            }
        }
    }
    def cleanup = tasks.register('cleanKubeJsSmoke') {
        doLast {
            if (target.isFile() && Arrays.equals(target.bytes, payload)) target.delete()
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        dependsOn prepare
        finalizedBy cleanup
        doLast {
            if (!resultFile.isFile()) throw new GradleException('RigWorks KubeJS acceptance did not produce a result')
            def result = new groovy.json.JsonSlurper().parse(resultFile)
            if (result.success != true) throw new GradleException("RigWorks KubeJS acceptance failed: ${result.failure}")
        }
    }
}
